name: Refresh dependency checksums

# Run by hand (or by pushing the deps-refresh branch) after changing dependencies.
# Writes gradle/verification-metadata.xml to the deps-metadata branch for review;
# it is copied into main only after it has been reviewed.
on:
  workflow_dispatch:
  push:
    branches: [deps-refresh]

permissions:
  contents: read

# Two runs must not race to update the deps-metadata branch
concurrency:
  group: deps-refresh
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.14.3"
          # Nothing from earlier runs: every file is downloaded, so every checksum is written
          cache-disabled: true
      - name: Write checksums
        shell: bash
        run: |
          rm -f gradle/verification-metadata.xml
          # Failing tests must not stop the checksums from being written; the log shows why
          gradle --no-daemon --refresh-dependencies --continue --write-verification-metadata sha256 testReleaseUnitTest assembleRelease > deps.log 2>&1 || true
          mkdir -p meta
          cp gradle/verification-metadata.xml meta/ 2>/dev/null || echo "no metadata written" > meta/MISSING
          # (no matches is fine: grep would otherwise stop the step under pipefail)
          { grep -E "^e: |FAILED|What went wrong|Exception" -A5 deps.log | head -200 || true; echo ----; tail -80 deps.log; } > meta/deps.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-metadata
          path: meta/
          retention-days: 7

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verification-metadata
          path: out
      - name: Push for review
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only these two files, and only if the XML is readable
          mkdir push && cd push
          cp ../out/deps.log . 2>/dev/null || true
          if [ -f ../out/verification-metadata.xml ]; then
            python3 -c "import sys, xml.dom.minidom as m; m.parse(sys.argv[1])" ../out/verification-metadata.xml
            cp ../out/verification-metadata.xml .
          fi
          # This folder holds only the files copied above
          git init -q && git checkout -q -b deps-metadata && git add .
          git -c user.name=ci -c user.email=ci@localhost commit -qm "verification metadata ${{ github.run_number }}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" deps-metadata
